[project]
name = "backend-app"
version = "0.1.0"
description = "FastAPI backend application"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1.0",
    "alembic>=1.13.1",
    "anthropic>=1.0.0",
    "pywebpush>=2.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "database", "models", "schemas", "ai_service", "batch", "auth", "park_cases", "notifications", "images", "push", "faq", "spreadsheet"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.env.example"]
