services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ~/.aws:/root/.aws:ro
      - .:/workspace/backend
      - /workspace/backend/app/.venv
      - ./environments:/workspace/backend/app/environments
      - ./README.md:/workspace/backend/app/README.md
    ports:
      - "8000:8000"
    env_file:
      - ./environments/.env.local
      # Claude APIキー（任意・Git管理外）。無い場合はキーワード簡易判定で動く
      - path: ./environments/.env.secret
        required: false
    environment:
      - ENVIRONMENT=local
      - TZ=Asia/Tokyo
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: backend-db
    # 日時を日本時間で記録する
    command: --default-time-zone=+09:00
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "database"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
      MYSQL_ROOT_PASSWORD: "password"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: